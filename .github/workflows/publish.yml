name: publish

# Publishes to npm when a GitHub release is published, with provenance: npm
# shows that the package was built here, from this commit. Uses npm's trusted
# publishing (OIDC): no npm token is stored anywhere. It must first be
# configured once on npmjs.com, under the package's Settings → Trusted
# publishers: repository Kernel-Science/agentic-physics-cli, workflow
# publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      # a version already on npm (the first one was published by hand) is left as it is
      - id: published
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "agentic-physics@$version" version >/dev/null 2>&1; then echo "already=true" >> "$GITHUB_OUTPUT"; else echo "already=false" >> "$GITHUB_OUTPUT"; fi
      # trusted publishing needs npm 11.5.1 or later
      - if: steps.published.outputs.already == 'false'
        run: npx --yes npm@11.21.1 publish --provenance --access public
